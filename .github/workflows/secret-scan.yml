name: secret-scan
# Fleet baseline (doxa-cns config/fleet.yaml): every The-Doxa-Way repo runs this file.
# gitleaks (MIT; the CLI, not the action, which needs a paid licence for an org repo). GitHub's own
# secret scanning is not used on private repos (CEO decision 2026-11-03).
# On a PR it scans only the PR's own commits; this job (`gitleaks`) is a required check through
# the org ruleset "fleet: PR + secret scan". On a push to the default branch (repos with sanctioned
# direct commits only) it scans the pushed range. Weekly and by hand it scans all of history,
# where findings already classified are in .gitleaksignore (each pinned to its commit, so the same
# value committed again still fails). Config: .gitleaks.toml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the PR's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Scanning $base..HEAD"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges $base..HEAD"

      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; else range="HEAD~1..HEAD"; fi
          echo "Scanning $range"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges $range"

      - name: Scan all of history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact --no-banner --exit-code 1

      - name: What to do
        if: failure()
        run: |
          {
            echo "## Secret scan found something"
            echo "1. Don't paste the value anywhere. If it is real, rotate it first: history keeps it."
            echo "2. Then remove it from the code."
            echo "3. If it is not a secret, add its fingerprint to .gitleaksignore with the reason, in the same PR."
          } >> "$GITHUB_STEP_SUMMARY"
